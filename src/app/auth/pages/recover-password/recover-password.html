<article class="bg-base">
  <section
    class="flex flex-col bg-white text-black p-[25px] md:p-[50px] lg:p-[50px] 2xl:p-[50px] 3xl:p-[50px] rounded-3xl w-[90%] md:w-[490px] lg:w-[490px] 2xl:w-[490px] 3xl:w-[490px] items-center"
  >
    <div class="flex-row"><mat-icon>book</mat-icon><mat-icon>local_movies</mat-icon></div>
    <span class="font-bold text-2xl">Recuperar contraseña</span>
    <div class="w-[75%] text-center">
      <span class="font-medium text-base text-[#7B7B7B]"
        >Te enviaremos un enlace para restablecer tu contraseña</span
      >
    </div>
    <form [formGroup]="form" class="mt-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Correo electrónico</mat-label>
        <input matInput formControlName="email" />
        <mat-icon matSuffix>email</mat-icon>
        @if (form.get('email')?.hasError('required')) {
        <mat-error>Correo electrónico requerido</mat-error>
        } @if (form.get('email')?.hasError('email')) {
        <mat-error>Correo electrónico inválido</mat-error>
        }
      </mat-form-field>
      <button mat-fab extended routerLink="" (click)="RecoverPassword()" class="!w-full">
        Enviar enlace
      </button>
    </form>
    <a class="mt-6 font-medium text-sm text-[#9811FB]" routerLink="/auth/login"
      >Volver al inicio de sesión</a
    >
  </section>
</article>
